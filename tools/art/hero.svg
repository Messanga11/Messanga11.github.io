<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 640" fill="none" aria-hidden="true" focusable="false">
<style>
.ha-win{fill:var(--art-window,#FFFFFF)}.ha-bar{fill:var(--art-window-bar,#F3EDE6)}.ha-wall{fill:var(--art-wall-2,#E6D8C8)}
.ha-desk{fill:var(--art-furniture,#E2D3C3)}.ha-wood{fill:var(--art-wood,#D98E2B)}.ha-lamp{fill:var(--art-lamp,#F59E0B)}
.ha-glow{fill:var(--art-lamp-glow,#FFF4D6)}.ha-cord{stroke:var(--art-cord,#0A0A0A)}.ha-p1{fill:var(--art-plant-1,#3F6E4A)}
.ha-p2{fill:var(--art-plant-2,#6FA37B)}.ha-pot{fill:var(--art-pot,#FFFFFF)}.ha-dev{fill:var(--art-device,#0A0A0A);stroke:var(--art-device-edge,#0A0A0A)}
.ha-acc{fill:var(--art-accent,#2563EB)}.ha-accs{stroke:var(--art-accent,#2563EB)}.ha-sh{fill:var(--art-shadow,rgba(10,10,10,.08))}
.ha-rim{stroke:var(--art-rim,rgba(255,255,255,0))}
</style>
